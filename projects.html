<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef8ff">
  <meta name="description" content="Research projects by Rikka Botan — the SEA Model series of efficient language models.">
  <title>Projects | Rikka Botan</title>
  <link rel="icon" href="images/RikkaBotan_Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.className += " js";</script>
</head>
<body data-page="projects">
  <main>
    <div class="page-head">
      <h1><span class="emoji">🩵</span> Projects</h1>
      <p class="sub">The SEA Model series</p>
    </div>

    <section>
      <div class="card project-intro">
        <h3>SEA Model series</h3>
        <p>The goal is to develop high-accuracy, high-speed language models through original improvements to projection representations and model architectures.</p>
        <img class="project-hero-img" src="images/SEAModel_series.gif" alt="SEA Model series">
      </div>

      <div class="sea-grid">
        <div class="sea-card tilt">
          <div class="sea-thumb"><img src="images/Saint_Iberis_logo.png" alt="Saint Iberis logo" loading="lazy"></div>
          <span class="op">Op.0</span>
          <h3>Saint Iberis</h3>
        </div>
        <div class="sea-card tilt">
          <div class="sea-thumb"><img src="images/SaintLupinus.png" alt="Saint Lupinus logo" loading="lazy"></div>
          <span class="op">Op.1</span>
          <h3>Saint Lupinus</h3>
        </div>
        <div class="sea-card tilt">
          <div class="sea-thumb"><img src="images/SaintPlumeria_logo.jpg" alt="Saint Plumeria logo" loading="lazy"></div>
          <span class="op">Op.2</span>
          <h3>Saint Plumeria</h3>
        </div>
      </div>
    </section>
  </main>

  <script src="layout.js"></script>
  <script src="script.js"></script>
</body>
</html>
